# Last verified: 2026-02-21
name: Weekly EMA Crossover Screener

on:
  # Saturday 7:00 AM Singapore time (SGT = UTC+8) → Friday 11:00 PM UTC
  schedule:
    - cron: '0 23 * * 5'
  
  # Allow manual trigger for testing
  workflow_dispatch:

jobs:
  run-screener:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      REPORT_TIMEZONE: Asia/Singapore

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Create output directories
        run: mkdir -p output output/charts logs

      - name: Run EMA Crossover Screener
        run: python screener.py --no-cache

      - name: Find generated PDF
        id: find-pdf
        run: |
          PDF_FILE=$(python - <<'PYCODE'
          import json
          from pathlib import Path
          summary = json.loads(Path('output/run_summary.json').read_text())
          name = summary.get('report_path')
          if not (summary.get('gate_passed') and summary.get('email_allowed') and summary.get('report_generated')):
              raise SystemExit('Unreliable report; email suppressed')
          if not name or Path(name).name != name or not (Path('output') / name).is_file():
              raise SystemExit('Missing report')
          print(Path('output') / name)
          PYCODE
          )
          echo "pdf_path=$PDF_FILE" >> "$GITHUB_OUTPUT"

      - name: Send email with report
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          CC_EMAIL: ${{ secrets.CC_EMAIL }}
        run: python send_email.py "${{ steps.find-pdf.outputs.pdf_path }}"

      - name: Upload report and quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ema-crossover-report
          path: |
            output/*.pdf
            output/run_summary.json
          retention-days: 30
